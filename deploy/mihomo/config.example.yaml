# Mihomo 配置模板：复制到 runtime/mihomo/config.yaml 后填入两个订阅地址。
# 真实订阅 URL 含凭据，禁止提交到 Git。

log-level: info
mode: rule
allow-lan: false
ipv6: false
external-controller: 127.0.0.1:19090
secret: "REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"

proxy-providers:
  primary-provider:
    type: http
    url: "REPLACE_WITH_PRIMARY_SUBSCRIPTION_URL"
    path: ./providers/primary.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204

  backup-provider:
    type: http
    url: "REPLACE_WITH_BACKUP_SUBSCRIPTION_URL"
    path: ./providers/backup.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: false
      expected-status: 204

proxy-groups:
  - name: PRIMARY-AUTO
    type: url-test
    use:
      - primary-provider
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: false

  - name: BACKUP-AUTO
    type: url-test
    use:
      - backup-provider
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 100
    lazy: false

  - name: OUTBOUND
    type: fallback
    proxies:
      - PRIMARY-AUTO
      - BACKUP-AUTO
    url: https://www.gstatic.com/generate_204
    interval: 300
    lazy: false

listeners:
  - name: crawler-proxy
    type: mixed
    listen: 127.0.0.1
    port: 17890
    proxy: OUTBOUND
    udp: false

rules:
  - MATCH,OUTBOUND
